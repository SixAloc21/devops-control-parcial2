
name: DevOps Control - CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1 - PRUEBAS AUTOMATIZADAS
  # ==========================================
  pruebas-automatizadas:
    name: Tests and Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verificar configuración JWT
        run: |
          if [ -z "$TEST_JWT_SECRET" ]; then
            echo "ERROR: Falta TEST_JWT_SECRET"
            exit 1
          fi

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

      - name: Instalar navegador Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar 40 pruebas automatizadas
        working-directory: frontend
        run: npx playwright test

      - name: Subir reportes de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devops-control-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Confirmar calidad del proyecto
        if: success()
        run: |
          echo "=================================="
          echo " DEVOPS CONTROL - CI EXITOSA"
          echo "=================================="
          echo "40 pruebas Playwright aprobadas"
          echo "Proyecto apto para construir Docker"

  
  # ==========================================
  # JOB 2 - BUILD AND PUSH DOCKER IMAGES
  # ==========================================
  construir-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: pruebas-automatizadas

    # Publicar solo en push a main, nunca en pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            gaelnj17/devops-control-backend:latest
            gaelnj17/devops-control-backend:${{ github.sha }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            gaelnj17/devops-control-frontend:latest
            gaelnj17/devops-control-frontend:${{ github.sha }}

      - name: Confirmar publicación
        run: |
          echo "=================================="
          echo " DEVOPS CONTROL - DOCKER HUB"
          echo "=================================="
          echo "Backend y frontend publicados"
          echo "Commit: ${{ github.sha }}"



  # ==========================================
  # JOB 3 - DESPLIEGUE AUTOMATICO EN AWS EC2
  # ==========================================
  desplegar-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: construir-docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: devops-control-production
      cancel-in-progress: false

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity --query Arn --output text

      - name: Ejecutar despliegue mediante Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-00d646a73de5b081b"

          jq -n \
            --arg cmd "bash /home/ubuntu/devops-control-parcial2/scripts/deploy-ec2.sh ${GITHUB_SHA}" \
            '{commands: [$cmd], executionTimeout: ["600"]}' \
            > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "DevOps Control deployment" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Commit: $GITHUB_SHA"

          # Consultar hasta que el despliegue termine.
          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "Intento $attempt - Estado: $STATUS"

            case "$STATUS" in
              Success)
                echo "Despliegue finalizado correctamente."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "ERROR: Fallo el despliegue en EC2."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: Se agoto el tiempo de verificacion."
          exit 1


  # ==========================================
  # JOB 4 - REPORTAR CI/CD A OPENOBSERVE
  # ==========================================
  reportar-openobserve:
    name: Report CI/CD to OpenObserve
    runs-on: ubuntu-latest
    timeout-minutes: 8

    needs:
      - pruebas-automatizadas
      - construir-docker
      - desplegar-ec2

    # Ejecutar incluso si las pruebas o el despliegue fallan.
    # Solo para ejecuciones push a main.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    env:
      TEST_RESULT: ${{ needs.pruebas-automatizadas.result }}
      BUILD_RESULT: ${{ needs.construir-docker.result }}
      DEPLOY_RESULT: ${{ needs.desplegar-ec2.result }}

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Registrar resultados en OpenObserve
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-00d646a73de5b081b"

          # Preparar comandos y escapar los argumentos.
          python3 - <<'PY'
          import json
          import os
          import shlex

          script = "/home/ubuntu/openobserve/report-ci-event.py"

          events = [
              ("tests_result", os.environ["TEST_RESULT"]),
              ("docker_build_result", os.environ["BUILD_RESULT"]),
              ("deployment_result", os.environ["DEPLOY_RESULT"]),
          ]

          commands = ["set -eu"]

          for event_type, result in events:
              args = [
                  "python3", script,
                  "--status", result.upper(),
                  "--commit", os.environ["GITHUB_SHA"],
                  "--branch", os.environ["GITHUB_REF_NAME"],
                  "--actor", os.environ["GITHUB_ACTOR"],
                  "--event", event_type,
                  "--run-id", os.environ["GITHUB_RUN_ID"]
              ]

              commands.append(
                  " ".join(shlex.quote(arg) for arg in args)
              )

          with open("ssm-report-parameters.json", "w") as file:
              json.dump({
                  "commands": commands,
                  "executionTimeout": ["120"]
              }, file)

          print("Eventos preparados:", len(events))
          PY

          # Solicitar ejecución en EC2 mediante Systems Manager.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "DevOps Control - CI/CD observability" \
            --parameters file://ssm-report-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Comprobar que OpenObserve recibió los eventos.
          for attempt in $(seq 1 40); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "Intento $attempt - Estado: $STATUS"

            case "$STATUS" in

              Success)
                echo "EVENTOS REGISTRADOS EN OPENOBSERVE"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "ERROR: No se pudieron registrar los eventos."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 3
          done

          echo "ERROR: Tiempo de espera agotado."
          exit 1




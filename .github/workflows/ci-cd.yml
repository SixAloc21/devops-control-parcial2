
name: DevOps Control - CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1 - PRUEBAS AUTOMATIZADAS
  # ==========================================
  pruebas-automatizadas:
    name: Tests and Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verificar configuración JWT
        run: |
          if [ -z "$TEST_JWT_SECRET" ]; then
            echo "ERROR: Falta TEST_JWT_SECRET"
            exit 1
          fi

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

      - name: Instalar navegador Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar 40 pruebas automatizadas
        working-directory: frontend
        run: npx playwright test

      - name: Subir reportes de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devops-control-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Confirmar calidad del proyecto
        if: success()
        run: |
          echo "=================================="
          echo " DEVOPS CONTROL - CI EXITOSA"
          echo "=================================="
          echo "40 pruebas Playwright aprobadas"
          echo "Proyecto apto para construir Docker"

  # ==========================================
  # JOB 2 - CONSTRUIR IMAGENES DOCKER
  # ==========================================
  construir-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No se ejecuta si las pruebas fallan
    needs: pruebas-automatizadas

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen del backend
        run: |
          docker build \
            -f backend/Dockerfile \
            -t devops-control-backend:${{ github.sha }} \
            ./backend

      - name: Construir imagen del frontend
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t devops-control-frontend:${{ github.sha }} \
            ./frontend

      - name: Confirmar construcción
        run: |
          echo "=================================="
          echo " DEVOPS CONTROL - DOCKER OK"
          echo "=================================="
          docker image ls
          echo "Ambas imagenes construidas"
          echo "Commit: ${{ github.sha }}"


name: DevOps Control - CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1 - PRUEBAS AUTOMATIZADAS
  # ==========================================
  pruebas-automatizadas:
    name: Tests and Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verificar configuración JWT
        run: |
          if [ -z "$TEST_JWT_SECRET" ]; then
            echo "ERROR: Falta TEST_JWT_SECRET"
            exit 1
          fi

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

      - name: Instalar navegador Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar 40 pruebas automatizadas
        working-directory: frontend
        run: npx playwright test

      - name: Subir reportes de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devops-control-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Confirmar calidad del proyecto
        if: success()
        run: |
          echo "=================================="
          echo " DEVOPS CONTROL - CI EXITOSA"
          echo "=================================="
          echo "40 pruebas Playwright aprobadas"
          echo "Proyecto apto para construir Docker"

  
  # ==========================================
  # JOB 2 - BUILD AND PUSH DOCKER IMAGES
  # ==========================================
  construir-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: pruebas-automatizadas

    # Publicar solo en push a main, nunca en pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            gaelnj17/devops-control-backend:latest
            gaelnj17/devops-control-backend:${{ github.sha }}

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            gaelnj17/devops-control-frontend:latest
            gaelnj17/devops-control-frontend:${{ github.sha }}

      - name: Confirmar publicación
        run: |
          echo "=================================="
          echo " DEVOPS CONTROL - DOCKER HUB"
          echo "=================================="
          echo "Backend y frontend publicados"
          echo "Commit: ${{ github.sha }}"


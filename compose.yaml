
name: devops-control

services:

  # ==========================================
  # BACKEND - EXPRESS + SQLITE
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: devops-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/usuarios.db

    volumes:
      - sqlite_data:/app/data

    expose:
      - "3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - devops-network

  # ==========================================
  # FRONTEND - REACT + NGINX
  # ==========================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: devops-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - devops-network

# ============================================
# VOLUMEN PERSISTENTE
# ============================================

volumes:
  sqlite_data:

# ============================================
# RED INTERNA
# ============================================

networks:
  devops-network:
    driver: bridge
